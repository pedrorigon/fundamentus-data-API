services:
  fundamentus-api:
    build: .
    environment:
      FUNDAMENTUS_API_BIND_HOST: 0.0.0.0
      FUNDAMENTUS_API_BIND_PORT: 8000
      FUNDAMENTUS_API_SQLITE_CACHE_PATH: /data/fundamentus_cache.sqlite3
      FUNDAMENTUS_API_DATABASE_URL: ${FUNDAMENTUS_API_DATABASE_URL:-}
      FUNDAMENTUS_API_INCOME_STORE_URL: ${FUNDAMENTUS_API_INCOME_STORE_URL:-}
      FUNDAMENTUS_API_ASSESSMENT_SQLITE_PATH: ${FUNDAMENTUS_API_ASSESSMENT_SQLITE_PATH:-}
      FUNDAMENTUS_API_ASSESSMENT_LEASE_SECONDS: ${FUNDAMENTUS_API_ASSESSMENT_LEASE_SECONDS:-3600}
      FUNDAMENTUS_API_ASSESSMENT_MAX_ATTEMPTS: ${FUNDAMENTUS_API_ASSESSMENT_MAX_ATTEMPTS:-3}
      FUNDAMENTUS_API_ASSESSMENT_PERIOD_HISTORY_DAYS: ${FUNDAMENTUS_API_ASSESSMENT_PERIOD_HISTORY_DAYS:-370}
      FUNDAMENTUS_API_ASSESSMENT_RETRY_BACKOFF_SECONDS: ${FUNDAMENTUS_API_ASSESSMENT_RETRY_BACKOFF_SECONDS:-15}
      FUNDAMENTUS_API_CACHE_INVALIDATE_TOKEN: ${FUNDAMENTUS_API_CACHE_INVALIDATE_TOKEN:-}
      FUNDAMENTUS_API_BRAPI_TOKEN: ${FUNDAMENTUS_API_BRAPI_TOKEN:-}
      FUNDAMENTUS_API_ALPHA_VANTAGE_API_KEY: ${FUNDAMENTUS_API_ALPHA_VANTAGE_API_KEY:-}
    command:
      - python
      - -m
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - fundamentus-cache:/data

volumes:
  fundamentus-cache:
